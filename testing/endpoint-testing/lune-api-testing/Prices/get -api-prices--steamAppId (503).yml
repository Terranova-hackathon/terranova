info:
  name: get /api/prices/:steamAppId (503 Service Unavailable)
  type: http
  seq: 3
  tags:
    - Prices

http:
  method: GET
  url: "{{baseUrl}}/api/prices/:steamAppId"
  params:
    - name: steamAppId
      value: ""
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "503"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 503 Response - Service Unavailable
    description: Service Unavailable - Price providers are unreachable or misconfigured
    request:
      url: "{{baseUrl}}/api/prices/570"
      method: GET
      params:
        - name: steamAppId
          value: "570"
          type: path
    response:
      status: 503
      statusText: Service Unavailable
      body:
        type: json
        data:
          type: "https://tools.ietf.org/html/rfc9110#section-15.6.4"
          title: "Price data is currently unavailable."
          status: 503
          detail: "Platform errors: GG.deals: [error details]; Steam: [error details]"
