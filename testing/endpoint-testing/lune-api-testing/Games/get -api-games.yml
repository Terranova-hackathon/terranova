info:
  name: get /api/games
  type: http
  seq: 1
  tags:
    - Games

http:
  method: GET
  url: "{{baseUrl}}/api/games"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
    - name: genres
      value: ""
      type: query
      disabled: true
    - name: platforms
      value: ""
      type: query
      disabled: true
    - name: developers
      value: ""
      type: query
      disabled: true
    - name: publishers
      value: ""
      type: query
      disabled: true
    - name: ordering
      value: ""
      type: query
      disabled: true
    - name: metacriticMin
      value: ""
      type: query
      disabled: true
    - name: metacriticMax
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.body
      operator: isNotEmpty
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isNotEmpty
    - expression: res..body.page
      operator: isNotEmpty
    - expression: res.body.pageSize
      operator: isNumber
    - expression: res.body.totalCount
      operator: isNumber
    - expression: res.body.totalPages
      operator: isNumber
    - expression: res.body.items[0]
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/games"
      method: GET
      params:
        - name: search
          value: ""
