        - name: page
          value: "1"
          type: query
        - name: pageSize
          value: "20"
          type: query
        - name: genres
          value: ""
          type: query
          disabled: true
        - name: platforms
          value: ""
          type: query
          disabled: true
        - name: developers
          value: ""
          type: query
          disabled: true
        - name: publishers
          value: ""
          type: query
          disabled: true
        - name: ordering
          value: ""
          type: query
          disabled: true
        - name: metacriticMin
          value: ""
          type: query
