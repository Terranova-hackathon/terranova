info:
  name: put /api/auth/profile
  type: http
  seq: 6
  tags:
    - Auth

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/profile"
  body:
    type: json
    data: |-
      {
        "displayName": "New Display Name"
      }
  auth: inherit

runtime:
