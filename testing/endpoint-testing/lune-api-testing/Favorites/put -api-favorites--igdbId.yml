http:
  method: PUT
  url: "{{baseUrl}}/api/favorites/:igdbId"
  params:
    - name: ""
      value: "{{username}}"
      type: query
    - name: igdbId
      value: "{{gameId}}"
      type: path
  auth: inherit

runtime:
