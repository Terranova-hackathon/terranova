info:
  name: get /api/favorites
  type: http
  seq: 3
  tags:
    - Favorites

http:
  method: GET
  url: "{{baseUrl}}/api/favorites"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isDefined
    - expression: res.body.page
      operator: eq
      value: "1"
    - expression: res.body.pageSize
      operator: eq
      value: "20"
    - expression: res.body.totalCount
      operator: isNumber
    - expression: res.body.totalPages
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/favorites"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: pageSize
          value: "20"
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
