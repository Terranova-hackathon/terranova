info:
  name: Get Game By ID
  type: http
  seq: 2
  tags:
    - Games

http:
  method: GET
  url: "{{baseUrl}}/api/games/:id"
  params:
    - name: id
      value: ""
      type: path
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "6"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

