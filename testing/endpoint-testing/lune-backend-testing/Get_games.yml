info:
  name: Get_games
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/games"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isNotEmpty
    - expression: res.body.items
      operator: isNotEmpty
    - expression: res..body.page
      operator: isNotEmpty
    - expression: res.body.pageSize
      operator: isNumber
    - expression: res.body.totalCount
      operator: isNumber
    - expression: res.body.totalPages
      operator: isNumber
    - expression: res.body.items[0]
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

