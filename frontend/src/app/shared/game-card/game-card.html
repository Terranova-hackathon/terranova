<article class="game-card">
	<a [routerLink]="['/games', game().id]" class="game-card__link">
		<img
			class="game-card__image"
			[src]="game().backgroundImage || 'images/placeholder.jpg'"
			[alt]="game().name"
		/>
	</a>

	<div class="game-card__content">
		<div class="game-card__heading">
			<h3><a [routerLink]="['/games', game().id]">{{ game().name }}</a></h3>

			<button
				type="button"
				class="game-card__favorite"
				[class.is-favorite]="isFavorite()"
				[disabled]="favoriteBusy()"
				[attr.aria-label]="isFavorite() ? 'Remove' + game().name + ' from favorites'
					: 'Add ' + game().name + ' to favorites'"
				[attr.aria-pressed]="isFavorite()"
				(click)="toggleFavorite()"
			>
				<i 
					class="bi"
					[class.bi-heart-fill]="isFavorite()"
					[class.bi-heart]="!isFavorite()"
					aria-hidden="true"
				></i>
			</button>
		</div>

		<p class="game-card__release">
			Released: {{ game().released || 'unknown' }}
		</p>

		<p class="game-card__rating">
			@if (game().rating > 0) {
				<i class="bi bi-star-fill" aria-hidden="true"></i>
				{{ game().rating | number:'1.1-1' }}
			} @else {
				Not rated yet
			}
		</p>


		<p class="game-card__metacritic">
			Metactritic: {{ game().metacritic ?? 'unknown' }}
		</p>

		<div class="game-card__platforms">
			@for (platform of game().platforms; track platform) {
				<span>{{ platform }}</span>
			}
		</div>
	</div>
</article>
