<header class="navbar">
	<nav class="navbar__container" aria-label="Main navigation">
		<a class="navbar__brand" routerLink="/">
			<span class="navbar__icon"><i class="bi bi-controller"></i></span>
			<span>GameHub</span>
		</a>

		<div class="navbar__links">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{exact: true}">
				Home
			</a>

			<a routerLink="/games" routerLinkActive="active">
				Games
			</a>

			@if (auth.isLoggedIn()) {
				<a routerLink="/favorites" routerLinkActive="active">
					Favorites
				</a>

				<span class="navbar-user">
					{{ auth.user()?.displayName || auth.user()?.email }}
				</span>

				<button type="button" class="btn btn-outline-light btn-sm"
					[disabled]="loggingOut()" (click)="logout()"
				>
					Log out
				</button>
			} @else {
				<a routerLink="/login" routerLinkActive="active">
					Log in
				</a>

				<a routerLink="/register" routerLinkActive="active">
					Sign up
				</a>
			}
		</div>
	</nav>
</header>
