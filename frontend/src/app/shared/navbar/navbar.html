<header class="navbar">
	<nav class="navbar__container" aria-label="Main navigation">
		<a class="navbar__brand" routerLink="/">
			<span class="navbar__icon"><i class="luna-icon luna-icon--eclipse"></i></span>
			<span>LunaNova</span>
		</a>

		<div class="navbar__links">
		<a
			routerLink="/"
			routerLinkActive="active"
			[routerLinkActiveOptions]="{exact: true}"
		>
			Home
		</a>

		<a
			[routerLink]="gamesNavigation.gamesUrl()"
			routerLinkActive="active"
		>
			Games
		</a>

		@if (auth.isLoggedIn()) {
			<a routerLink="/favorites" routerLinkActive="active">
				Favorites
			</a>

			<div class="navbar__account" #accountMenu>

				<button
					type="button"
					class="navbar__user"
					(click)="toggleAccountMenu()"
					[attr.aria-expanded]="accountOpen()"
					aria-controls="account-dropdown"
					aria-haspopup="true"
				>
					<i class="luna-icon luna-icon--helmet" aria-hidden="true"></i>

						{{ auth.user()?.displayName || auth.user()?.email }}

					<i
						class="bi"
						[class.bi-chevron-up]="accountOpen()"
						[class.bi-chevron-down]="!accountOpen()"
						aria-hidden="true"
					></i>
				</button>

				@if (accountOpen()) {
					<div
						id="account-dropdown"
						class="navbar__account-dropdown"
					>
						<h2>My Account</h2>

						@if (auth.user(); as user) {
							<div class="navbar__account-profile">
								<i class="luna-icon luna-icon--helmet" aria-hidden="true"></i>

								<div>
									<strong>{{ user.displayName || 'User' }}</strong>
									<p>{{ user.email }}</p>
								</div>
							</div>
						}
						<hr />

						<button
							type="button"
							class="navbar__account-manage"
							(click)="openAdvancedSettings()"
						>
							<i class="bi bi-pencil-square" aria-hidden="true"></i>
							Manage your account information
							<i class="bi bi-chevron-right" aria-hidden="true"></i>
						</button>

						<button
							type="button"
							class="btn btn-primary w-100"
							(click)="openAdvancedSettings()"
						>
							<i class="bi bi-gear me-2" aria-hidden="true"></i>
							Advanced Settings
						</button>
						<hr />

						<button
							type="button"
							class="btn btn-outline-danger w-100"
							[disabled]="loggingOut()"
							(click)="logout()"
						>
							<i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
							{{ loggingOut() ? 'Logging out...' : 'Log out' }}
						</button>
					</div>
				}
			</div>

			} @else {
				<a routerLink="/login" routerLinkActive="active">
					Log in
				</a>

				<a routerLink="/register" routerLinkActive="active">
					Sign up
				</a>
			}
			<button
				type="button"
				class="navbar__theme-toggle"
				(click)="themeService.toggleTheme()"
				[attr.aria-label]="themeService.theme() === 'dark'
				? 'Light mode' : 'Dark mode'"
			>
				@if (themeService.theme() === 'dark') {
					<i class="bi bi-sun-fill" aria-hidden="true"></i>
				} @else {
					<i class="bi bi-moon-fill" aria-hidden="true"></i>
				}
			</button>
		</div>
	</nav>
</header>
