<main class="home">
	<section class="hero">
		@if (featuredGames().length) {
			<app-featured-game class="hero__backdrop" [games]="featuredGames()" />
		} @else if (featuredLoading()) {
			<div class="hero__loading" role="status">
				<div class="spinner-border text-light" aria-hidden="true"></div>
				<span class="visually-hidden">Loading featured games...</span>
			</div>
		}
		<div class="hero__content">
			<div class="hero__search-wrap">
				<form class="hero__search" role="search"
					(ngSubmit)="submitSearch()">
						<label for="game-search" class="visually-hidden">
							Search for a video game
						</label>

				<input
					id="game-search"
					type="search"
					name="search"
					placeholder="Search for games..."
					autocomplete="off"
					[(ngModel)]="searchInput"
					(ngModelChange)="onSearchInput($event)"
				/>
				<button type="submit">Search</button>

				</form>

				@if (suggestions().length) {
					<ul class="hero__suggestions" aria-label="Suggested games">
						@for (game of suggestions(); track game.id) {
							<li>
								<button type="button" (click)="pickSuggestion(game)">
									{{ game.name }}
								</button>
							</li>
						}
					</ul>
				}
			</div>
			<app-game-filters
				class="hero__filters"
				[initialState]="gamesNavigation.lastFilterState()"
				[active]="gamesNavigation.hasActiveFilters()"
				(applied)="submitSearch()"
				(cleared)="resetFilters()"
			/>
		</div>
    @if (featuredError()) {
        <div class="alert alert-danger position-fixed top-50 start-50 translate-middle z-3 m-4" role="alert">
          Unable to load featured games.
          <button class="btn btn-outline-danger ms-2" (click)="loadFeatured()">Retry</button>
        </div>
      }
	</section>

</main>
