<main class="home">
	<section class="hero">
		<div class="hero__content">
			<p class="hero__eyebrow">Welcome to GameHub</p>

			<h1>Discover games worth playing.</h1>
    
			<p class="hero__description">Explore thousands of video games, find hidden gems, and connect with other players.</p>

			<form class="hero__search" role="search">
				<label for="game-search" class="visually-hidden">
					Search for a video game
				</label>

			<input
				id="game-search"
				type="search"
				name="search"
				placeholder="Search for games..."
			/>

			<button type="submit">Search</button>
			</form>
		</div>
	</section>
</main>
