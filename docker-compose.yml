services:
    # Mock API (ASP.NET Core, in-memory). Starts by default so the frontend can be built without the real backend.
    mock-api:
        build:
            context: ./mock-api
            dockerfile: Dockerfile
        ports:
            - '4001:4001'
        volumes:
            - ./mock-api:/app
            - /app/bin
            - /app/obj
        networks:
            - private-network
        healthcheck:
            test: ['CMD-SHELL', 'curl -fs http://localhost:4001/health || exit 1']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    # SQL Server (real backend only: docker compose --profile real up)
    sqlserver:
        profiles: ['real']
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${SA_PASSWORD}
        ports:
            - '1433:1433'
        volumes:
            - sqlserver-data:/var/opt/mssql
        networks:
            - private-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped

    # ASP.NET Core Web API (real backend only: docker compose --profile real up)
    backend:
        profiles: ['real']
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '3001:3001'
        environment:
            - Jwt__Key=${JWT_KEY}
            - Rawg__ApiKey=${RAWG_API_KEY}
        volumes:
            - ./backend:/app
            - /app/bin
            - /app/obj
        networks:
            - private-network
        depends_on:
            sqlserver:
                condition: service_healthy
        restart: unless-stopped

    # Angular frontend. /api is proxied to API_URL (the mock by default).
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        environment:
            - API_URL=${API_URL:-http://mock-api:4001}
        volumes:
            - ./frontend:/app
            - /app/node_modules
        networks:
            - private-network
        depends_on:
            mock-api:
                condition: service_healthy
        restart: unless-stopped

networks:
    private-network:
        driver: bridge

volumes:
    sqlserver-data:
